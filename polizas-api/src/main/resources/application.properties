spring.application.name=polizas-api
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1

# Sin valor por defecto: si faltan, no arranca.
seguridad.api-key=${API_KEY:}
core.api-key=${CORE_API_KEY:}
core.base-url=${CORE_BASE_URL:}

# Dias antes del vencimiento para poder renovar. Falta confirmarlo con negocio.
polizas.renovacion.ventana-dias=${RENOVACION_VENTANA_DIAS:60}
polizas.datos-iniciales=false

# El DANE no tiene API, en esta pagina esta el enlace al Excel.
ipc.dane.pagina-url=https://www.dane.gov.co/index.php/estadisticas-por-tema/precios-y-costos/indice-de-precios-al-consumidor-ipc
ipc.sincronizacion.habilitada=true
ipc.sincronizacion.cron=0 0 6 * * *
